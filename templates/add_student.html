<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Add Student · BioBytes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="container my-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card p-4 shadow-sm">
        <div class="page-header d-flex justify-content-between align-items-center mb-3">
          <h4 class="mb-0">Add Student & Capture Faces</h4>
          <div class="page-actions">
            <a class="btn btn-outline-primary" href="{{ url_for('manage_students') }}">Students</a>
            <a class="btn btn-outline-secondary" href="{{ url_for('index') }}">Back</a>
          </div>
        </div>
        <p class="text-muted">Use the laptop webcam to capture face photos. Captured photos are saved in the local SQLite database for training.</p>

        <form id="studentForm">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="row g-2">
            <div class="col-md-6"><input class="form-control" name="name" placeholder="Full Name" required></div>
            <div class="col-md-3"><input class="form-control" name="roll" placeholder="Roll Number" required></div>
            <div class="col-md-3"><input class="form-control" name="reg_no" placeholder="Registration No"></div>
            <div class="col-md-6"><input class="form-control" name="class" placeholder="Class / Cohort (e.g. IT)"></div>
            <div class="col-md-6"><input class="form-control" name="sec" placeholder="Section (e.g. A)"></div>
            <div class="col-md-6"><input class="form-control" type="email" name="email" placeholder="Student Email (for lecture receipts)" required></div>
            <div class="col-md-6"><input class="form-control" type="password" name="password" placeholder="Password (default is Roll Number)"></div>
          </div>
          <div class="mt-3 d-flex gap-2 flex-wrap">
            <button id="saveInfoBtn" type="submit" class="btn btn-primary">Save Info</button>
            <button id="detectCameraBtn" type="button" class="btn btn-outline-primary" disabled>Detect cameras</button>
            <button id="startCaptureBtn" type="button" class="btn btn-warning" disabled>Start Capture (50)</button>
            <button id="addStudentBtn" type="button" class="btn btn-success" disabled>Add Student</button>
          </div>
          <div class="mt-3">
            <label class="form-label" for="cameraSelect">Webcam (choose the laptop's built-in webcam)</label>
            <select id="cameraSelect" class="form-select" disabled>
              <option value="">Detect cameras first</option>
            </select>
          </div>
        </form>

        <hr>

        <div class="text-center">
          <video id="video" autoplay muted playsinline></video>
          <div class="mt-2">
            <div id="captureStatus" class="small text-muted">Captured 0 / 50</div>
            <div class="progress mt-1" style="height:12px;">
              <div id="progressBar" class="progress-bar bg-success" style="width:0%"></div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/camera_picker.js') }}"></script>
<script src="{{ url_for('static', filename='js/camera_add_student.js') }}"></script>
</body>
</html>
